```html
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neelam Computer And Online - Auto Print</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
      margin: 0;
    }

    .card {
      max-width: 440px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0002;
      text-align: center;
    }

    h2 { color: #174ea6; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      color: white;
      background: #1769d2;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    small { color: #555; }
  </style>
</head>

<body>
  <div class="card">
    <h2>Neelam Computer And Online</h2>
    <p>PDF ya photo chunein. Photo A4 page par fit hokar print hogi.</p>

    <form id="printForm">
      <input
        type="file"
        id="file"
        accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
        required
      >

      <small>
        PDF, JPG, JPEG, PNG<br>
        PDF adhiktam 20 MB, photo adhiktam 20 MB
      </small>

      <button id="printBtn" type="submit">प्रिंट करें</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <script>
    const WORKER_URL =
      "https://neelam-print-server.karanchandel25.workers.dev/";

    const form = document.getElementById("printForm");
    const fileInput = document.getElementById("file");
    const button = document.getElementById("printBtn");
    const status = document.getElementById("status");

    // PDF banane wali library ko zarurat par load karein.
    async function loadJsPDF() {
      if (window.jspdf && window.jspdf.jsPDF) {
        return window.jspdf.jsPDF;
      }

      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js",
        "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
        "https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"
      ];

      for (const url of urls) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = url;
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error("Library load nahi hui"));
            };
            document.head.appendChild(script);
          });

          if (window.jspdf && window.jspdf.jsPDF) {
            return window.jspdf.jsPDF;
          }
        } catch (error) {
          // Agla CDN try karein.
        }
      }

      throw new Error(
        "PDF library load nahi hui. Internet check karke dobara try karein."
      );
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Photo khul nahi pai. Dusri photo chunein."));
        };

        image.src = url;
      });
    }

    async function makeA4Pdf(file) {
      const jsPDF = await loadJsPDF();
      const image = await loadImage(file);

      const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
        compress: true
      });

      const pageWidth = 210;
      const pageHeight = 297;
      const margin = 5;
      const maxWidth = pageWidth - margin * 2;
      const maxHeight = pageHeight - margin * 2;

      const ratio = Math.min(
        maxWidth / image.naturalWidth,
        maxHeight / image.naturalHeight
      );

      const width = image.naturalWidth * ratio;
      const height = image.naturalHeight * ratio;
      const x = (pageWidth - width) / 2;
      const y = (pageHeight - height) / 2;

      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;

      const context = canvas.getContext("2d");

      if (!context) {
        throw new Error("Photo process nahi ho pai.");
      }

      // Photo ke transparent hisse bhi safed rahenge.
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0);

      const isPng = /\.png$/i.test(file.name);
      const imageData = isPng
        ? canvas.toDataURL("image/png")
        : canvas.toDataURL("image/jpeg", 0.92);

      pdf.addImage(
        imageData,
        isPng ? "PNG" : "JPEG",
        x, y, width, height
      );

      return pdf.output("blob");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (button.disabled) return;

      const file = fileInput.files[0];

      if (!file) {
        status.textContent = "Pehle file chunein.";
        return;
      }

      const name = file.name.toLowerCase();
      const isPdf = name.endsWith(".pdf");
      const isJpg = /\.(jpg|jpeg)$/i.test(name);
      const isPng = name.endsWith(".png");

      if (!isPdf && !isJpg && !isPng) {
        status.textContent = "Sirf PDF, JPG, JPEG ya PNG file chunein.";
        return;
      }

      if (file.size === 0) {
        status.textContent = "File khali hai. Dusri file chunein.";
        return;
      }

      if (file.size > (20 * 1024 * 1024) {
        status.textContent = isPdf
          ? "PDF 20 MB se chhoti honi chahiye."
          : "Photo 20 MB se chhoti honi chahiye.";
        return;
      }

      button.disabled = true;

      try {
        let uploadFile = file;

        if (!isPdf) {
          status.textContent = "Photo ko A4 PDF mein badal rahe hain...";

          const blob = await makeA4Pdf(file);

          if (blob.size > 20 * 1024 * 1024) {
            throw new Error(
              "Taiyar PDF 3 MB se badi hai. Chhoti photo chunein."
            );
          }

          uploadFile = new File(
            [blob],
            "photo-a4.pdf",
            { type: "application/pdf" }
          );
        }

        const data = new FormData();
        data.append("file", uploadFile);

        status.textContent = "Print server ko file bhej rahe hain...";

        const response = await fetch(WORKER_URL, {
          method: "POST",
          body: data
        });

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error(
            "Server ka jawab samajh nahi aaya. Dobara try karein."
          );
        }

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Print bhejne mein dikkat hui."
          );
        }

        status.textContent =
          "File print queue mein bhej di gayi hai. Printer check karein.";

        form.reset();

      } catch (error) {
        status.textContent =
          error.message ||
          "Error aaya. Internet aur print server check karein.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
