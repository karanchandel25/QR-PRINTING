<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neelam Computer And Online - Auto Print</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
      margin: 0;
    }

    .card {
      max-width: 440px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0002;
      text-align: center;
    }

    h2 { color: #174ea6; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      color: white;
      background: #1769d2;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    small { color: #555; }
  </style>
</head>

<body>
  <div class="card">
    <h2>Neelam Computer And Online</h2>
    <p>PDF ya photo chunein. Photo A4 page par fit hokar print hogi.</p>

    <form id="printForm">
      <input
        type="file"
        id="file"
        accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
        required
      >

      <small>
        PDF, JPG, JPEG, PNG<br>
        Maximum file size: 20 MB
      </small>

      <button id="printBtn" type="submit">प्रिंट करें</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <script>
    const WORKER_URL =
      "https://neelam-print-server.karanchandel25.workers.dev/";

    const MAX_SIZE = 20 * 1024 * 1024;

    const form = document.getElementById("printForm");
    const fileInput = document.getElementById("file");
    const button = document.getElementById("printBtn");
    const status = document.getElementById("status");

    async function loadJsPDF() {
      if (window.jspdf && window.jspdf.jsPDF) {
        return window.jspdf.jsPDF;
      }

      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js",
        "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
        "https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"
      ];

      for (const url of urls) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = url;
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error("Library load failed"));
            };
            document.head.appendChild(script);
          });

          if (window.jspdf && window.jspdf.jsPDF) {
            return window.jspdf.jsPDF;
          }
        } catch (error) {
          // Try the next CDN.
        }
      }

      throw new Error(
        "PDF library load nahi hui. Internet check karein."
      );
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Photo khul nahi pai."));
        };

        img.src = url;
      });
    }

    async function makeA4Pdf(file) {
      const jsPDF = await loadJsPDF();
      const img = await loadImage(file);

      const pageWidth = 210;
      const pageHeight = 297;
      const margin = 5;

      const availableWidth = pageWidth - margin * 2;
      const availableHeight = pageHeight - margin * 2;

      const ratio = Math.min(
        availableWidth / img.naturalWidth,
        availableHeight / img.naturalHeight
      );

      // A4 ke liye image size control karein.
      // Isse bahut badi photos ka PDF size kam rahega.
      const maxCanvasWidth = 1654;
      const maxCanvasHeight = 2339;

      const scale = Math.min(
        maxCanvasWidth / img.naturalWidth,
        maxCanvasHeight / img.naturalHeight,
        1
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(
        1, Math.round(img.naturalWidth * scale)
      );
      canvas.height = Math.max(
        1, Math.round(img.naturalHeight * scale)
      );

      const ctx = canvas.getContext("2d");

      if (!ctx) {
        throw new Error("Photo process nahi ho pai.");
      }

      // White background, including transparent PNG areas.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // JPEG compression se PDF size control mein rahega.
      const imageData = canvas.toDataURL("image/jpeg", 0.88);

      const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
        compress: true
      });

      const width = img.naturalWidth * ratio;
      const height = img.naturalHeight * ratio;
      const x = (pageWidth - width) / 2;
      const y = (pageHeight - height) / 2;

      pdf.addImage(
        imageData,
        "JPEG",
        x, y, width, height,
        undefined,
        "FAST"
      );

      return pdf.output("blob");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (button.disabled) return;

      const file = fileInput.files[0];

      if (!file) {
        status.textContent = "Pehle file chunein.";
        return;
      }

      const name = file.name.toLowerCase();
      const isPdf = name.endsWith(".pdf");
      const isJpg = /\.(jpg|jpeg)$/i.test(name);
      const isPng = name.endsWith(".png");

      if (!isPdf && !isJpg && !isPng) {
        status.textContent =
          "Sirf PDF, JPG, JPEG ya PNG file chunein.";
        return;
      }

      if (file.size === 0) {
        status.textContent = "File khali hai.";
        return;
      }

      if (file.size > MAX_SIZE) {
        status.textContent =
          "File 20 MB se chhoti honi chahiye.";
        return;
      }

      button.disabled = true;

      try {
        let uploadFile = file;

        if (!isPdf) {
          status.textContent =
            "Photo ko A4 PDF mein badal rahe hain...";

          const blob = await makeA4Pdf(file);

          if (blob.size > MAX_SIZE) {
            throw new Error(
              "Taiyar PDF 20 MB se badi hai."
            );
          }

          uploadFile = new File(
            [blob],
            "photo-a4.pdf",
            { type: "application/pdf" }
          );
        }

        const data = new FormData();
        data.append("file", uploadFile);

        status.textContent =
          "File print server ko bhej rahe hain...";

        const response = await fetch(WORKER_URL, {
          method: "POST",
          body: data
        });

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error(
            "Server ka jawab nahi mila. Dobara try karein."
          );
        }

        if (!response.ok || !result.success) {
          throw new Error(
            result.error ||
            "Print server ne file accept nahi ki."
          );
        }

        status.textContent =
          "File print queue mein bhej di gayi hai. Printer check karein.";

        form.reset();

      } catch (error) {
        status.textContent =
          error.message ||
          "Error aaya. Internet aur server check karein.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
