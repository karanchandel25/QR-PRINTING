
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neelam Computer And Online - Print Studio</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:14px;color:#172033}
.wrap{max-width:760px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 16px #0002}
h2{color:#174ea6}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,button{width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:7px}
button{background:#1769d2;color:white;border:0;margin-top:14px;font-weight:bold;cursor:pointer}
.secondary{background:#475569}
small{color:#475569}
.hidden{display:none!important}
#previewBox{margin-top:16px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}
#openPdf{display:block;background:#1769d2;color:white;padding:15px;text-align:center;border-radius:8px;text-decoration:none;font-weight:bold}
#status{overflow-wrap:anywhere;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.note{font-size:13px;background:#eff6ff;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<h2>NEELAM COMPUTER AND ONLINE</h2>
<p>PDF या फोटो चुनें, Preview बनाएँ और PrintNode पर भेजें।</p>

<label for="file">PDF या फोटो चुनें</label>
<input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
<small>PDF, JPG, JPEG, PNG. मौजूदा Worker की सीमा 3 MB है।</small>

<div id="pdfSettings" class="hidden">
<label for="pages">PDF के पेज चुनें</label>
<input id="pages" placeholder="उदाहरण: 1-5 या 2,5,10">
<small>खाली छोड़ने पर सभी पेज चुने जाएँगे।</small>
</div>

<div id="photoSettings" class="hidden">
<h3>फोटो सेटिंग</h3>
<div class="grid">
<div>
<label for="layout">एक A4 पर फोटो</label>
<select id="layout">
<option value="1">1 फोटो</option>
<option value="2">2 फोटो</option>
<option value="4">4 फोटो</option>
</select>
</div>
<div>
<label for="copies">कुल फोटो</label>
<input id="copies" type="number" min="1" max="100" value="1">
</div>
<div>
<label for="rotation">Rotate</label>
<select id="rotation">
<option value="0">0°</option><option value="90">90°</option>
<option value="180">180°</option><option value="270">270°</option>
</select>
</div>
<div>
<label for="zoom">Zoom / Crop</label>
<input id="zoom" type="range" min="1" max="2.5" step="0.1" value="1">
<small id="zoomValue">1.0×</small>
</div>
</div>
</div>

<label for="printCopies">PDF की कॉपी संख्या</label>
<input id="printCopies" type="number" min="1" max="20" value="1">

<button id="prepareBtn" type="button">Preview तैयार करें</button>

<div id="previewBox" class="hidden">
<p>PDF तैयार है। नीचे बटन दबाकर PDF खोलें।</p>
<a id="openPdf" href="#" target="_blank" rel="noopener">PDF खोलें</a>
</div>

<button id="printBtn" type="button" disabled>PrintNode पर भेजें</button>
<button id="resetBtn" type="button" class="secondary">रीसेट करें</button>
<p id="status" role="status" aria-live="polite"></p>
</div>

<script>
const WORKER_URL="https://neelam-print-server.karanchandel25.workers.dev/";
const MAX_WORKER_SIZE=3*1024*1024;
const $=id=>document.getElementById(id);
let selectedFile=null,fileKind=null,preparedBlob=null,previewUrl=null;

function say(t){$("status").textContent=t}
function positiveInt(el,max,label){
 const n=Number(el.value);
 if(!Number.isInteger(n)||n<1||n>max)throw Error(label+" 1 se "+max+" ke beech rakhein.");
 return n;
}
function loadScript(url,test){
 if(test())return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const s=document.createElement("script");s.src=url;
  s.onload=()=>test()?resolve():reject(Error("PDF library load nahi hui."));
  s.onerror=()=>{s.remove();reject(Error("PDF library load nahi hui. Internet check karein."))};
  document.head.appendChild(s);
 });
}
async function getPDFLib(){
 await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js",()=>!!window.PDFLib);
 return window.PDFLib;
}
function parsePages(text,total){
 if(!text.trim())return Array.from({length:total},(_,i)=>i);
 const set=new Set();
 for(const raw of text.split(",")){
  const p=raw.trim(),m=p.match(/^(\d+)\s*-\s*(\d+)$/);
  if(m){
   const a=+m[1],b=+m[2];
   if(a<1||b<a||b>total)throw Error("Page range 1-"+total+" ke beech rakhein.");
   for(let n=a;n<=b;n++)set.add(n-1);
  }else if(/^\d+$/.test(p)){
   const n=+p;if(n<1||n>total)throw Error("Page number 1-"+total+" ke beech rakhein.");
   set.add(n-1);
  }else throw Error("Page aise likhein: 1-5 ya 2,5,10");
 }
 if(!set.size)throw Error("Sahi page number likhein.");
 return [...set].sort((a,b)=>a-b);
}
async function makePdf(file){
 const {PDFDocument}=await getPDFLib();
 if(fileKind==="pdf"){
  const src=await PDFDocument.load(await file.arrayBuffer());
  const indices=parsePages($("pages").value,src.getPageCount());
  const count=positiveInt($("printCopies"),20,"PDF copies");
  const out=await PDFDocument.create();
  for(let c=0;c<count;c++){
   const ps=await out.copyPages(src,indices);ps.forEach(p=>out.addPage(p));
  }
  return new Blob([await out.save()],{type:"application/pdf"});
 }
 const img=await new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};
  im.onerror=()=>{URL.revokeObjectURL(url);reject(Error("Photo khul nahi pai."))};
  im.src=url;
 });
 const total=positiveInt($("copies"),100,"Photo count");
 const per=+$("layout").value,rot=+$("rotation").value,zoom=+$("zoom").value;
 const pdf=await PDFDocument.create(),W=595.28,H=841.89,margin=18,gap=12;
 let remaining=total;
 while(remaining>0){
  const page=pdf.addPage([W,H]),slots=Math.min(per,remaining);
  const cols=per===1?1:2,rows=per===4?2:(per===2?2:1);
  const cw=(W-margin*2-gap*(cols-1))/cols,ch=(H-margin*2-gap*(rows-1))/rows;
  const canvas=document.createElement("canvas");canvas.width=1240;canvas.height=1754;
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<slots;i++){
   const col=i%cols,row=Math.floor(i/cols);
   const x=(margin+col*(cw+gap))*1240/W,y=(margin+row*(ch+gap))*1754/H;
   const w=(cw-6)*1240/W,h=(ch-6)*1754/H;
   ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
   ctx.translate(x+w/2,y+h/2);ctx.rotate(rot*Math.PI/180);
   const swap=rot%180!==0,sw=swap?img.naturalHeight:img.naturalWidth,sh=swap?img.naturalWidth:img.naturalHeight;
   const scale=Math.max(w/sw,h/sh)*zoom;
   ctx.drawImage(img,-img.naturalWidth*scale/2,-img.naturalHeight*scale/2,img.naturalWidth*scale,img.naturalHeight*scale);
   ctx.restore();
  }
  const jpg=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.85));
  if(!jpg)throw Error("Photo PDF nahi ban pai.");
  const embedded=await pdf.embedJpg(await jpg.arrayBuffer());
  page.drawImage(embedded,{x:0,y:0,width:W,height:H});
  remaining-=slots;
 }
 return new Blob([await pdf.save()],{type:"application/pdf"});
}
function clearPreview(){
 preparedBlob=null;$("printBtn").disabled=true;$("previewBox").classList.add("hidden");
 $("openPdf").removeAttribute("href");
 if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}
}
$("file").addEventListener("change",()=>{
 clearPreview();selectedFile=$("file").files[0]||null;
 const n=selectedFile?.name.toLowerCase()||"";
 fileKind=n.endsWith(".pdf")?"pdf":(/\.(jpg|jpeg|png)$/.test(n)?"image":null);
 $("pdfSettings").classList.toggle("hidden",fileKind!=="pdf");
 $("photoSettings").classList.toggle("hidden",fileKind!=="image");
 say(selectedFile?(fileKind?"File chuni gayi: "+selectedFile.name:"Sirf PDF, JPG ya PNG chunein"):"");
});
$("zoom").addEventListener("input",()=>$("zoomValue").textContent=(+$("zoom").value).toFixed(1)+"×");

$("prepareBtn").addEventListener("click",async()=>{
 if(!selectedFile||!fileKind){say("Pehle PDF ya photo chunein.");return}
 if(selectedFile.size>20*1024*1024){say("File 20 MB se chhoti honi chahiye.");return}
 $("prepareBtn").disabled=true;clearPreview();say("PDF taiyar ho rahi hai...");
 try{
  preparedBlob=await makePdf(selectedFile);
  if(preparedBlob.size>MAX_WORKER_SIZE){preparedBlob=null;throw Error("Taiyar PDF 3 MB se badi hai. Cloudflare Worker ki limit badhani hogi.")}
  previewUrl=URL.createObjectURL(preparedBlob);
  $("openPdf").href=previewUrl;
  $("previewBox").classList.remove("hidden");
  $("printBtn").disabled=false;
  say("PDF taiyar hai. PDF khol kar check karein.");
 }catch(e){say(e.message||"PDF taiyar nahi hui.")}
 finally{$("prepareBtn").disabled=false;$("printBtn").disabled=!preparedBlob}
});
$("printBtn").addEventListener("click",async()=>{
 if(!preparedBlob)return;
 $("printBtn").disabled=true;$("prepareBtn").disabled=true;say("Print server ko bhej rahe hain...");
 try{
  const data=new FormData();data.append("file",preparedBlob,"neelam-print.pdf");
  const r=await fetch(WORKER_URL,{method:"POST",body:data});
  let result;try{result=await r.json()}catch{throw Error("Server ka jawab nahi mila.")}
  if(!r.ok||!result.success)throw Error(result.error||"Print server ne file accept nahi ki.");
  say("File print queue mein bhej di gayi. Printer check karein. Job ID: "+(result.jobId||"sent"));
 }catch(e){say(e.message||"Internet ya server check karein.")}
 finally{$("prepareBtn").disabled=false;$("printBtn").disabled=!preparedBlob}
});
$("resetBtn").addEventListener("click",()=>{
 $("file").value="";$("pages").value="";$("layout").value="1";$("copies").value="1";
 $("rotation").value="0";$("zoom").value="1";$("zoomValue").textContent="1.0×";$("printCopies").value="1";
 selectedFile=null;fileKind=null;clearPreview();$("pdfSettings").classList.add("hidden");
 $("photoSettings").classList.add("hidden");say("Reset ho gaya.");
});
</script>
</body>
</html>
